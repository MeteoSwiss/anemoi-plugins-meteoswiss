    max_horizontal_scale: 300000
    kth_closest_obs_horizontal_scale: 2
    debug: false
    basic: true
    tpostneg: [5.5, 4.5]
  PMSL:
    background_elab_type: 3
    num_min_outer: 3
    num_max_outer: 20
