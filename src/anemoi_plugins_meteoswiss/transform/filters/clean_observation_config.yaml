    num_max_outer: 20
    inner_radius: 150000
    outer_radius: 250000
    num_iterations: 10
    num_min_prof: 0
    min_elev_diff: 750
    min_horizontal_scale: 250
    max_horizontal_scale: 300000
    kth_closest_obs_horizontal_scale: 2
    debug: false
    basic: true
    tpostneg: [6.5, 5.0]
  SP_10M:
    background_elab_type: 3
