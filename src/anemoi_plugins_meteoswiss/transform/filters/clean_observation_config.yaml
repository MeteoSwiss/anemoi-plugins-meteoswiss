# Trusted stations — never blacklisted by automated QC regardless of score
stations_excluded:
  T_2M:    {stations: []}
  TD_2M:   {stations: []}
  T_G:     {stations: []}
  RH_2M:   {stations: []}
  SP_10M:  {stations: []}
  VMAX10M: {stations: []}
  PS:      {stations: []}
  PMSL:    {stations: []}

# Stations permanently set to NaN for the listed parameters
hard_blacklist:
  1: {station: WNSSAL, paras: [SP_10M, VMAX10M, DD]}

# Set to true to write one PNG per parameter alongside the output parquet (requires cartopy)
plot_maps: true

# QC parameter -> parquet plausibility column (written by RetrieveObservation as {param}_pi)
par2pi:
  T_2M:    2t_pi
  TD_2M:   2d_pi
  SP_10M:  ff_pi
  VMAX10M: vmax_pi
  PS:      sp_pi
  PMSL:    msl_pi
  T_G:     skt_pi

# parquet column -> QC parameter (unit conversion is always identity)
# SP_10M is derived from 10u/10v — handled separately in CleanObservation
parquet_to_qc:
  2t:   T_2M
  2d:   TD_2M
  vmax: VMAX10M
  sp:   PS
  msl:  PMSL
  skt:  T_G

# QC parameter -> parquet columns to set to NaN when flagged
qc_to_parquet:
  T_2M:    [2t]
  TD_2M:   [2d]
  SP_10M:  [10u, 10v]
  VMAX10M: [vmax]
  PS:      [sp]
  PMSL:    [msl]
  T_G:     [skt]
