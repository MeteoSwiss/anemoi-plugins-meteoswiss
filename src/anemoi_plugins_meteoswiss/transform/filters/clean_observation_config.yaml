# QC parameter list to check
par2check:
  - T_2M
  - TD_2M
  - SP_10M
  - VMAX10M
  - T_G
  - PS
  - PMSL

# Tests that work without model/background data
obs_only_tests:
  - hard
  - isolation_check
  - buddy_obs
  - DWH_flag
  - plateau_test

# Test selection and scoring per parameter
# tests_QC and tests_QC_w must have the same length
titan_ntests_threshold:
  T_2M:
    threshold_summary: 0.15
    tests_QC: [hard, isolation_check, buddy_obs, buddy_diff, fgt, plateau_test, DWH_flag]
    tests_QC_w: [2, 2, 1, 1, 1, 1, 1]
  TD_2M:
    threshold_summary: 0.15
    tests_QC: [hard, isolation_check, buddy_obs, buddy_diff, fgt, plateau_test, DWH_flag]
    tests_QC_w: [2, 2, 1, 1, 1, 1, 1]
  T_G:
    threshold_summary: 0.15
    tests_QC: [hard, isolation_check, buddy_obs, buddy_diff, fgt, plateau_test, DWH_flag]
    tests_QC_w: [2, 2, 1, 1, 1, 1, 1]
  SP_10M:
    threshold_summary: 0.15
    tests_QC: [hard, isolation_check, buddy_obs, buddy_diff, fgt, plateau_test, DWH_flag]
    tests_QC_w: [2, 2, 1, 1, 1, 2, 1]
  VMAX10M:
    threshold_summary: 0.15
    tests_QC: [hard, isolation_check, buddy_obs, buddy_diff, fgt, plateau_test, DWH_flag]
    tests_QC_w: [2, 2, 1, 1, 1, 2, 1]
  RH_2M:
    threshold_summary: 0.15
    tests_QC: [hard, isolation_check, buddy_obs, buddy_diff, fgt, plateau_test, DWH_flag]
    tests_QC_w: [2, 2, 1, 1, 1, 1, 1]
  PS:
    threshold_summary: 0.15
    tests_QC: [hard, isolation_check, buddy_obs, buddy_diff, fgt, plateau_test, DWH_flag]
    tests_QC_w: [2, 2, 1, 1, 1, 1, 1]
  PMSL:
    threshold_summary: 0.15
    tests_QC: [hard, isolation_check, buddy_obs, buddy_diff, fgt, plateau_test, DWH_flag]
    tests_QC_w: [2, 2, 1, 1, 1, 1, 1]

# Hard test: plausibility range per variable (order must match obs_variables)
#                     T_2M    TD_2M  RH_2M  SP_10M  VMAX10M   T_G      PS      PMSL   (Pa for pressure)
obs_variables: [T_2M, TD_2M, RH_2M, SP_10M, VMAX10M, T_G, PS, PMSL]
plausibility_thresholds:
  pch_min: [223.15, 203.15,   2,  0,   0, 223.15,  50000,  87000]
  pch_max: [323.15, 323.15, 100, 80,  80, 343.15, 108500, 108500]

# Isolation check (flags stations with too few neighbours)
isolation_check:
  T_2M:    {radius: 75000, num_min: 3}
  TD_2M:   {radius: 75000, num_min: 3}
  T_G:     {radius: 75000, num_min: 2}
  SP_10M:  {radius: 75000, num_min: 3}
  VMAX10M: {radius: 75000, num_min: 3}
  RH_2M:   {radius: 75000, num_min: 3}
  PS:      {radius: 75000, num_min: 3}
  PMSL:    {radius: 75000, num_min: 2}

# DWH plausibility test
dwh_force: true
DWH_flag:
  T_2M:    {dwh_plausibility_thr: 0.75}
  TD_2M:   {dwh_plausibility_thr: 0.75}
  T_G:     {dwh_plausibility_thr: 0.75}
  SP_10M:  {dwh_plausibility_thr: 0.75}
  RH_2M:   {dwh_plausibility_thr: 0.75}
  VMAX10M: {dwh_plausibility_thr: 0.75}
  PS:      {dwh_plausibility_thr: 0.75}
  PMSL:    {dwh_plausibility_thr: 0.75}

# Plateau test (detects frozen / stuck instruments)
plateau_test:
  T_2M:    {window: 24, gran: 360, sd: 0}
  TD_2M:   {window: 24, gran: 360, sd: 0}
  RH_2M:   {window: 48, gran: 360, sd: 0}
  T_G:     {window: 24, gran: 360, sd: 0}
  SP_10M:  {window: 24, gran:  60, sd: 0}
  VMAX10M: {window: 24, gran:  60, sd: 0}
  PS:      {window: 24, gran: 360, sd: 0}
  PMSL:    {window: 24, gran: 360, sd: 0}

# Buddy check on raw observations
# threshold: [SMN stations, other stations]
buddy:
  T_2M:
    radius: 100000
    num_min: 2
    threshold: [4.5, 3.0]
    max_elev_diff: 500
    elev_gradient: -0.0065
    min_std: 2
    num_iterations: 6
  TD_2M:
    radius: 100000
    num_min: 2
    threshold: [6.0, 4.5]
    max_elev_diff: 700
    elev_gradient: -0.0065
    min_std: 2
    num_iterations: 6
  T_G:
    radius: 100000
    num_min: 2
    threshold: [6.0, 4.5]
    max_elev_diff: 500
    elev_gradient: -0.0065
    min_std: 2
    num_iterations: 6
  SP_10M:
    radius: 100000
    num_min: 2
    threshold: [9.5, 8.0]
    max_elev_diff: 500
    elev_gradient: 0.0015
    min_std: 2
    num_iterations: 6
  RH_2M:
    radius: 100000
    num_min: 2
    threshold: [15, 10]
    max_elev_diff: 700
    elev_gradient: 0
    min_std: 1.5
    num_iterations: 6
  VMAX10M:
    radius: 100000
    num_min: 2
    threshold: [9.5, 8.0]
    max_elev_diff: 500
    elev_gradient: 0.0015
    min_std: 2
    num_iterations: 6
  PS:
    radius: 100000
    num_min: 2
    threshold: [1000, 750]   # Pa
    max_elev_diff: 500
    elev_gradient: -12.0     # Pa/m standard atmosphere
    min_std: 200
    num_iterations: 6
  PMSL:
    radius: 100000
    num_min: 2
    threshold: [500, 350]    # Pa
    max_elev_diff: 500
    elev_gradient: 0
    min_std: 100
    num_iterations: 6

