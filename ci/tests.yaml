# ci/tests.yaml — CSCS HPC pipeline "tests" (smoke test). On-demand only.
# Trigger:  PR comment `cscs-ci run tests`  or the trigger API.
# Another cluster for one run: `cscs-ci run tests;FIRECREST_SYSTEM=linard`.
#
# Single job that allocates a compute node, syncs the uv environment and runs
# pytest. The runner and the generic fragments (preamble, logging, workdir, uv)
# are the shared MeteoSwiss blocks — see
# https://github.com/MeteoSwiss/varda-cscs-ci-workflows; which cluster the job lands
# on is decided there (cluster.yml), not here.
include:
  - remote: 'https://raw.githubusercontent.com/MeteoSwiss/varda-cscs-ci-workflows/init/v1/.ci-ext-mch.yml'

stages:
  - test

.runner:
  extends: [.baremetal-runner-mch]
  variables:
    # uv sync builds the venv from scratch (eccodes, earthkit, meteodata-lab,
    # ...); give it more room than a bare hello-world needs.
    SLURM_TIMELIMIT: '00:20:00'
    # Work in the runner's checkout: HOME, uv and the venv live next to the code.
    MCH_WORK_DIR: '$CI_PROJECT_DIR'
    MCH_UV_SYNC_ARGS: '--all-extras --dev'

.pytest:
  script:
    - |
      banner "pytest"
      uv run --no-sync pytest

tests:
  extends: [.runner]
  stage: test
  script:
    - !reference [.mch-sh-preamble, script]
    - !reference [.mch-log-ci-context, script]
    - !reference [.mch-env-paths, script]
    - !reference [.mch-install-uv, script]
    - !reference [.mch-uv-sync, script]
    - !reference [.pytest, script]
