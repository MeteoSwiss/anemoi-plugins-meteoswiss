    outer_radius: 250000
    num_iterations: 10
    num_min_prof: 0
    min_elev_diff: 750
    min_horizontal_scale: 400
    max_horizontal_scale: 300000
    kth_closest_obs_horizontal_scale: 2
    debug: false
    basic: true
    tpostneg: [9.5, 8.0]
  VMAX10M:
    background_elab_type: 3
    num_min_outer: 3
    num_max_outer: 20
    inner_radius: 150000
    outer_radius: 250000
    num_iterations: 10
    num_min_prof: 0
    min_elev_diff: 750
    min_horizontal_scale: 400
    max_horizontal_scale: 300000
    kth_closest_obs_horizontal_scale: 2
    debug: false
    basic: true
    tpostneg: [9.5, 8.0]
  PS:
    background_elab_type: 3
    num_min_outer: 3
    num_max_outer: 20
    inner_radius: 150000
    outer_radius: 250000
    num_iterations: 10
    num_min_prof: 0
